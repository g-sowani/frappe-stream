<!-- static/watch.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Frappe Stream</title>
    <link href="https://vjs.zencdn.net/8.6.0/video-js.css" rel="stylesheet"/>
    <style>
        body { background: #0f0f0f; color: white; font-family: Arial; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .player-wrap { background: #000; border-radius: 8px; overflow: hidden; }
        h2 { margin-top: 16px; }
        .meta { color: #aaa; font-size: 14px; }
        .status { padding: 20px; text-align: center; color: #aaa; }
    </style>
</head>
<body>
<div class="container">
    <h1>▶ Frappe Stream</h1>
    <div class="player-wrap">
        <video
            id="player"
            class="video-js vjs-default-skin vjs-big-play-centered"
            controls preload="auto"
            style="width:100%;height:500px;"
        ></video>
    </div>
    <div id="info">
        <h2 id="title">Loading...</h2>
        <div class="meta" id="meta"></div>
        <p id="description"></p>
    </div>
</div>

<script src="https://vjs.zencdn.net/8.6.0/video.min.js"></script>
<script>
    const videoId = "{{VIDEO_ID}}";
    
    async function loadVideo() {
        const res = await fetch(`/api/v1/videos/${videoId}`);
        const video = await res.json();
        
        document.getElementById("title").textContent = video.title;
        document.getElementById("description").textContent = video.description;
        document.getElementById("meta").textContent = 
            `${Math.round(video.duration || 0)}s · ${video.views} views · ${video.status}`;
        
        if (video.status !== "published") {
            document.getElementById("info").innerHTML += 
                `<div class="status">⏳ Video is ${video.status}... refresh in a moment.</div>`;
            setTimeout(loadVideo, 3000);  // poll until published
            return;
        }
        
        const player = videojs("player", {
            fluid: false,
            html5: { vhs: { overrideNative: true } }
        });
        
        player.src({
            src: video.manifest_url,
            type: "application/x-mpegURL"
        });
    }
    
    loadVideo();
</script>
</body>
</html>
